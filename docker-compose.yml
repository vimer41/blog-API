version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    container_name: modsen-postgres-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  modsen-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: modsen-api
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  postgres_data: